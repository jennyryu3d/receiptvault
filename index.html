<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ReceiptVault</title>
<meta name="theme-color" content="#141210" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  /* ---------- 토큰 ---------- */
  :root{
    --bg:#141210; --panel:#1e1b18; --panel2:#262220; --line:#332d28;
    --ink:#f2ece4; --muted:#9b9089;
    --tan:#c8a26a;        /* 가죽 톤 강조색 */
    --tan-dim:#8a6f45;
    --green:#7fb069; --red:#d1685e; --amber:#d9a441;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{height:100%}
  button{font:inherit;color:inherit;cursor:pointer}

  /* ---------- 레이아웃 ---------- */
  .rv-app{display:flex;flex-direction:column;height:100%}
  .rv-screen{display:flex;flex-direction:column;height:100%;min-height:0}
  .rv-topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--line);
    background:var(--panel);position:sticky;top:0;z-index:5;
  }
  .rv-topbar strong{font-size:16px}
  .rv-body{flex:1;overflow-y:auto;padding:16px;padding-bottom:90px}
  .rv-center{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  .rv-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
           padding:26px;width:100%;max-width:400px}
  .rv-row{display:flex;gap:10px}
  .rv-grow{flex:1;min-width:0}
  .rv-wide{width:100%;margin-top:18px}

  /* ---------- 글자 ---------- */
  .rv-logo{font-size:22px;font-weight:700;letter-spacing:-.3px;color:var(--tan)}
  .rv-muted{color:var(--muted)}
  .rv-small{font-size:12.5px;line-height:1.6}
  .rv-ok{color:var(--green)}
  .rv-note{background:var(--panel2);border-radius:10px;padding:12px;margin-top:14px;
           white-space:pre-wrap;line-height:1.6}
  .rv-foot{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}

  /* ---------- 입력 ---------- */
  .rv-label{display:block;margin-top:16px;font-size:13px;color:var(--muted)}
  .rv-input{
    display:block;width:100%;margin-top:6px;padding:12px 13px;
    background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:11px;
    font-size:16px; /* 16px 미만이면 모바일에서 확대돼 버린다 */
  }
  .rv-input:focus{outline:none;border-color:var(--tan-dim)}
  textarea.rv-input{resize:vertical}
  .rv-year{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
           border-radius:9px;padding:7px 10px;font-size:14px}

  /* ---------- 버튼 ---------- */
  .rv-btn{background:var(--tan);color:#20180c;border:none;border-radius:11px;
          padding:13px 18px;font-weight:700;width:100%;margin-top:16px}
  .rv-btn:disabled{opacity:.45}
  .rv-btn-sm{background:var(--tan);color:#20180c;border:none;border-radius:9px;
             padding:8px 14px;font-weight:700;font-size:14px}
  .rv-btn-ghost{background:transparent;border:1px solid var(--line);border-radius:11px;
                padding:11px 15px;color:var(--ink)}
  .rv-btn-danger{background:var(--red);color:#1a0f0d;border:none;border-radius:11px;
                 padding:12px 18px;font-weight:700;width:100%;margin-bottom:8px}

  /* ---------- 배너 / 로딩 ---------- */
  .rv-banner{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;
             border-radius:11px;padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.6}
  .rv-banner-info{background:#1d2833;border:1px solid #2f4356}
  .rv-banner-warn{background:#2c2410;border:1px solid #5a4715;color:#f0d79a}
  .rv-banner-error{background:#2e1a18;border:1px solid #5c2f2a;color:#f0b5ae}
  .rv-banner-x{background:none;border:none;color:inherit;opacity:.6}
  .rv-spinner{display:flex;align-items:center;gap:10px;color:var(--muted);
              padding:14px 0;font-size:14px}
  .rv-spinner-dot{width:13px;height:13px;border-radius:50%;
    border:2px solid var(--tan-dim);border-top-color:transparent;animation:rv-spin .8s linear infinite}
  @keyframes rv-spin{to{transform:rotate(360deg)}}

  /* ---------- 목록 ---------- */
  .rv-month{margin-bottom:26px}
  .rv-month-head{display:flex;justify-content:space-between;font-size:13px;
                 padding:0 4px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .rv-item{display:flex;align-items:center;justify-content:space-between;gap:12px;
           width:100%;text-align:left;background:transparent;border:none;
           padding:13px 4px;border-bottom:1px solid rgba(255,255,255,.04)}
  .rv-item-title{font-size:15px;margin-bottom:4px}
  .rv-item-sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .rv-item-amt{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
  .rv-clip{opacity:.6}
  .rv-empty{text-align:center;color:var(--muted);padding:60px 20px}
  .rv-pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;
           border:1px solid var(--line)}
  .rv-pill-cogs{background:#22301f;border-color:#3b5535;color:#b9d6ac}
  .rv-pill-expense{background:#2a2620;border-color:#463d31;color:#d9c6a6}
  /* 합계에 잡히는 것 / 안 잡히는 것 — 목록에서 한눈에 갈리게 */
  .rv-pill-basis{background:#22301f;border-color:#3b5535;color:#b9d6ac}
  .rv-pill-nonbasis{background:#2b2523;border-color:#4a3b36;color:#c9b4ad}
  .rv-pill-personal{background:#232a30;border-color:#3a4653;color:#b7c6d6}

  /* ---------- 영문/한글 병기 라벨 ---------- */
  /* 영문이 본문, 한글은 옆에 작게. 세무사와 화면을 같이 봐도 말이 통하게. */
  .rv-l{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .rv-l b{font-weight:600}
  .rv-l i{font-style:normal;font-size:.78em;opacity:.6}
  .rv-tabs .rv-l{flex-direction:column;gap:1px;align-items:center}
  .rv-tabs .rv-l i{font-size:10px}
  .rv-country{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;
              font-size:10px;letter-spacing:.06em;
              background:var(--panel2);border:1px solid var(--line);color:var(--muted)}

  /* ---------- 환율 ---------- */
  .rv-fx{margin-top:14px;padding:14px;border-radius:12px;
         background:var(--panel2);border:1px solid var(--tan-dim)}
  .rv-fx-head{display:flex;justify-content:space-between;align-items:baseline;
              font-size:14px;padding-bottom:8px;margin-bottom:4px;
              border-bottom:1px solid var(--line)}
  .rv-fx-head strong{font-size:17px}
  .rv-cur-sel{width:104px;flex-shrink:0}
  .rv-country-sel{width:124px;flex-shrink:0}

  /* ---------- 사용량 막대 ---------- */
  .rv-quota-bar{height:6px;border-radius:99px;background:var(--panel2);
                border:1px solid var(--line);overflow:hidden;margin:8px 0}
  .rv-quota-fill{height:100%;background:var(--tan);border-radius:99px;
                 transition:width .3s}

  /* ---------- 맨 위 장부 막대 ---------- */
  .rv-ledgerbar{display:flex;align-items:center;gap:8px;width:100%;
                padding:10px 16px;background:var(--panel2);
                border:none;border-bottom:1px solid var(--line);text-align:left}
  .rv-ledgerbar-name{font-size:15px;font-weight:700;color:var(--ink);
                     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rv-ledgerbar-kind{font-size:11px;color:var(--muted);white-space:nowrap}
  .rv-ledgerbar-caret{color:var(--tan);font-size:12px}
  .rv-ledgerbar-n{margin-left:auto;font-size:11px;color:var(--muted);
                  border:1px solid var(--line);border-radius:20px;padding:1px 8px}
  /* 세금 성격을 점 색으로. 신고에 들어가는 장부인지 한눈에. */
  .rv-ledgerbar-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--muted)}
  .rv-ledgerbar-dot[data-scope="filing"]{background:var(--tan)}
  .rv-ledgerbar-dot[data-scope="future"]{background:var(--green)}

  .rv-inledger{display:flex;align-items:center;gap:7px;
               padding:8px 16px;font-size:12px;color:var(--muted);
               background:var(--panel2);border-bottom:1px solid var(--line)}

  /* ---------- 아래에서 올라오는 판 ---------- */
  .rv-sheet-back{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);
                 display:flex;align-items:flex-end}
  .rv-sheet{width:100%;max-height:82vh;overflow-y:auto;
            background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;
            padding:10px 16px 26px;border-top:1px solid var(--line)}
  .rv-sheet-grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
  .rv-sheet-title{font-size:13px;color:var(--tan);margin-bottom:6px}
  .rv-sheet-group{margin-top:14px}
  .rv-sheet-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
                 background:transparent;border:1px solid var(--line);border-radius:12px;
                 padding:13px 14px;margin-top:8px}
  .rv-sheet-on{border-color:var(--tan);background:rgba(198,160,106,.10)}
  .rv-sheet-name{display:flex;flex-direction:column;gap:2px;font-size:15px;min-width:0}
  .rv-sheet-kind{font-size:11px;color:var(--muted)}
  .rv-sheet-check{margin-left:auto;color:var(--tan)}

  /* ---------- 장부 종류 고르기 ---------- */
  .rv-kinds{display:flex;flex-direction:column;gap:10px;margin:16px 0 4px}
  .rv-scope{font-size:11px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
  .rv-kind{text-align:left;background:var(--panel2);border:1px solid var(--line);
           border-radius:12px;padding:13px 15px}
  .rv-kind-on{border-color:var(--tan);background:rgba(198,160,106,.10)}
  .rv-kind-t{font-size:15px;font-weight:700;color:var(--tan);margin-bottom:3px}
  .rv-kind-ko{font-size:12px;font-weight:400;color:var(--muted);margin-left:5px}
  .rv-kindtag{margin-top:10px;display:inline-block;padding:4px 11px;border-radius:20px;
              border:1px solid var(--tan-dim);color:var(--tan);font-size:13px}

  /* ---------- 맨 위 아이콘 버튼 (강제 갱신) ---------- */
  .rv-icon-btn{background:transparent;border:none;padding:4px;line-height:0;
               color:var(--tan);border-radius:10px}
  .rv-icon-btn:active{background:var(--panel2)}
  .rv-icon-btn:disabled{opacity:.6}
  .rv-spin svg{animation:rv-turn .8s linear infinite}
  @keyframes rv-turn{to{transform:rotate(360deg)}}

  /* ---------- 접었다 펴는 칸 ---------- */
  .rv-fold{display:flex;width:100%;align-items:center;justify-content:space-between;
           gap:10px;background:transparent;border:none;border-bottom:1px solid var(--line);
           margin:28px 0 4px;padding:0 0 7px;text-align:left}
  .rv-fold-t{font-size:14px;font-weight:700;color:var(--tan)}
  .rv-fold-c{color:var(--muted);font-size:12px;transition:transform .15s}
  .rv-fold-open{transform:rotate(180deg)}

  /* ---------- 연결 상태 · 앱 정보 ---------- */
  .rv-diag{margin-top:10px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .rv-diag-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
               padding:10px 13px;font-size:13px;
               border-bottom:1px solid rgba(255,255,255,.05)}
  .rv-diag-row:last-child{border-bottom:none}
  .rv-diag-k{color:var(--muted);font-size:12px;white-space:nowrap}
  .rv-diag-v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
             text-align:right;overflow-wrap:anywhere}
  .rv-diag-bad .rv-diag-v{color:var(--red)}
  .rv-about{margin-top:10px;padding:16px;border-radius:12px;
            background:var(--panel2);border:1px solid var(--line);text-align:center}
  .rv-about-name{font-size:16px;font-weight:700;color:var(--tan);letter-spacing:-.2px}
  .rv-stage{margin-left:8px;padding:1px 7px;border-radius:20px;font-size:10px;
            background:var(--tan-dim);color:#20180c}

  /* ---------- 세무사 자료 점검 ---------- */
  .rv-gaps{margin-top:16px;padding:14px;border-radius:12px;
           background:#2c2410;border:1px solid #5a4715}
  .rv-gaps-head{font-size:13px;color:#f0d79a;margin-bottom:10px}
  .rv-gap{display:flex;gap:12px;align-items:flex-start;padding:8px 0;
          border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
  .rv-gap:last-of-type{border-bottom:none}
  .rv-gap-n{flex-shrink:0;min-width:26px;text-align:center;padding:1px 6px;
            border-radius:20px;background:#5a4715;color:#f0d79a;
            font-size:12px;font-variant-numeric:tabular-nums}

  /* ---------- 화면 아래 고정 알림 ---------- */
  /* 저장 버튼 옆에서 결과가 보여야 한다. 폼 맨 위에 띄우면 화면 밖이라 안 보인다. */
  .rv-fixed-note{
    position:fixed; left:12px; right:12px; bottom:14px; z-index:30;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    padding:13px 15px; border-radius:12px; font-size:14px; line-height:1.6;
    box-shadow:0 8px 28px rgba(0,0,0,.45);
  }
  .rv-fixed-err{background:#3a201d; border:1px solid #7a3d36; color:#f6c9c1}
  .rv-fixed-busy{background:#262220; border:1px solid var(--line); color:var(--ink)}

  /* ---------- 세무사용 영문 표기 ---------- */
  .rv-en-box{
    margin-top:18px; padding:14px; border-radius:12px;
    background:var(--panel2); border:1px solid var(--line);
  }
  .rv-en-head{font-size:13px; color:var(--tan); margin-bottom:4px}

  /* ---------- 분할 ---------- */
  .rv-split-start{margin-top:12px;width:100%}
  .rv-warn-text{color:var(--amber)}
  .rv-splits{margin-top:16px;padding:14px;border-radius:12px;
             background:var(--panel2);border:1px solid var(--line)}
  .rv-splits-head{display:flex;justify-content:space-between;align-items:baseline;
                  font-size:13px;padding-bottom:10px;margin-bottom:4px;
                  border-bottom:1px solid var(--line)}
  .rv-split-row{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .rv-split-row:last-of-type{border-bottom:none}
  .rv-split-top{display:flex;gap:8px;align-items:center}
  .rv-split-top .rv-input{margin-top:0}
  .rv-split-x{background:none;border:none;color:var(--muted);padding:8px;font-size:15px}
  .rv-split-bottom{display:flex;gap:8px;margin-top:8px}
  .rv-split-bottom .rv-input{margin-top:0;flex:1}
  .rv-split-fill{white-space:nowrap;padding:11px 12px;font-size:13px}
  .rv-wide-sm{width:100%;margin-top:10px;padding:9px}
  .rv-splits-view{background:transparent}
  .rv-split-line{display:flex;justify-content:space-between;gap:12px;
                 padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .rv-split-line:last-child{border-bottom:none}
  .rv-split-badge{font-size:11px;color:var(--tan);border:1px solid var(--tan-dim);
                  border-radius:20px;padding:1px 7px}

  /* ---------- 사진 ---------- */
  .rv-photo-row{display:flex;gap:10px;margin-top:6px}
  .rv-preview{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);
              background:#000;max-height:340px;display:flex;justify-content:center}
  .rv-preview img{max-width:100%;max-height:340px;object-fit:contain}

  /* ---------- 상세 / 리포트 ---------- */
  .rv-detail-amt{font-size:34px;font-weight:700;letter-spacing:-1px;margin-bottom:6px}
  .rv-deduct{margin-top:18px;padding:13px;border-radius:11px;background:var(--panel2);
             display:flex;justify-content:space-between;align-items:baseline;gap:8px;
             flex-wrap:wrap;font-size:14px}
  .rv-deduct-k{font-weight:600}
  .rv-deduct-ko{color:var(--muted);font-size:12px}
  .rv-confirm{margin-top:22px;padding:16px;border-radius:12px;
              background:#2e1a18;border:1px solid #5c2f2a}
  .rv-report-sec{margin-bottom:30px}
  .rv-report-head{display:flex;justify-content:space-between;align-items:baseline;
                  font-size:15px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .rv-table{width:100%;border-collapse:collapse;margin-top:6px}
  .rv-table td{padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.04);
               vertical-align:top;font-size:14px}
  .rv-line{width:38px;color:var(--tan);font-variant-numeric:tabular-nums;font-size:12px;padding-top:13px}
  .rv-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---------- 설정: 식구 ---------- */
  .rv-h3{font-size:14px;margin:28px 0 4px;padding-bottom:7px;
         border-bottom:1px solid var(--line);color:var(--tan)}
  .rv-members{margin-top:10px}
  .rv-member{display:flex;justify-content:space-between;align-items:center;gap:12px;
             padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
  .rv-member-pending{opacity:.65}
  .rv-role{font-size:11px;color:var(--tan);border:1px solid var(--tan-dim);
           border-radius:20px;padding:2px 9px;white-space:nowrap}
  .rv-tiny{padding:6px 10px;font-size:12px}

  /* ---------- 세무사 자료 ---------- */
  .rv-taxdoc-actions{margin-bottom:22px}
  .tx-paper{
    background:#fff;color:#111;border-radius:10px;padding:26px 24px;
    font-size:13px;line-height:1.55;
    /* 종이 위의 문서라서 화면 테마와 무관하게 항상 흰 바탕 검은 글씨다 */
  }
  .tx-head{border-bottom:2px solid #111;padding-bottom:14px;margin-bottom:20px}
  .tx-head h1{font-size:19px;margin:0 0 3px;letter-spacing:-.2px}
  .tx-sub{margin:0 0 12px;color:#555;font-size:12.5px}
  .tx-meta{border-collapse:collapse;font-size:12px}
  .tx-meta td{padding:2px 0;vertical-align:top}
  .tx-meta td:first-child{color:#666;padding-right:16px;white-space:nowrap}
  .tx-sec{margin-bottom:22px}
  .tx-sec h2{font-size:13.5px;margin:0 0 8px;text-transform:uppercase;
             letter-spacing:.06em;color:#333}
  .tx-table{width:100%;border-collapse:collapse}
  .tx-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
               color:#666;border-bottom:1px solid #999;padding:5px 6px;font-weight:600}
  .tx-table td{padding:5px 6px;border-bottom:1px solid #e2e2e2}
  .tx-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tx-line{color:#666;width:44px;font-variant-numeric:tabular-nums}
  .tx-total td{border-top:1.5px solid #111;border-bottom:none;font-weight:700;padding-top:8px}
  .tx-grand .tx-total td{font-size:14px}
  .tx-notes{border-top:1px solid #ccc;padding-top:14px;font-size:11.5px;color:#444}
  .tx-notes h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
               color:#666;margin:0 0 6px}
  .tx-notes ul{margin:0;padding-left:17px}
  .tx-notes li{margin-bottom:3px}
  .tx-foot{margin-top:18px;padding-top:10px;border-top:1px solid #ccc;
           font-size:10.5px;color:#777;text-align:right}

  /* 인쇄하면 문서만 남는다. 태블릿 인쇄 화면에서 "PDF로 저장"을 고르면 그대로 파일이 된다. */
  @media print{
    html,body{background:#fff !important;color:#111 !important}
    .rv-noprint,.rv-tabs,.rv-topbar{display:none !important}
    .rv-screen,.rv-body{display:block !important;height:auto !important;
                        overflow:visible !important;padding:0 !important}
    .tx-paper{border-radius:0;padding:0;font-size:11pt}
    .tx-sec{page-break-inside:avoid}
    .tx-notes{page-break-inside:avoid}
    @page{margin:16mm}
  }

  /* ---------- 하단 탭 ---------- */
  .rv-tabs{display:flex;border-top:1px solid var(--line);background:var(--panel);
           padding-bottom:env(safe-area-inset-bottom)}
  .rv-tabs button{flex:1;background:none;border:none;padding:15px 0;
