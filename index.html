<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ReceiptVault</title>
<meta name="theme-color" content="#141210" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
  /* ---------- 토큰 ---------- */
  :root{
    --bg:#141210; --panel:#1e1b18; --panel2:#262220; --line:#332d28;
    --ink:#f2ece4; --muted:#9b9089;
    --tan:#c8a26a;        /* 가죽 톤 강조색 */
    --tan-dim:#8a6f45;
    --green:#7fb069; --red:#d1685e; --amber:#d9a441;
    --r:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #root{height:100%}
  button{font:inherit;color:inherit;cursor:pointer}

  /* ---------- 레이아웃 ---------- */
  .rv-app{display:flex;flex-direction:column;height:100%}
  .rv-screen{display:flex;flex-direction:column;height:100%;min-height:0}
  .rv-topbar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:14px 16px;border-bottom:1px solid var(--line);
    background:var(--panel);position:sticky;top:0;z-index:5;
  }
  .rv-topbar strong{font-size:16px}
  .rv-body{flex:1;overflow-y:auto;padding:16px;padding-bottom:90px}
  .rv-center{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  .rv-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
           padding:26px;width:100%;max-width:400px}
  .rv-row{display:flex;gap:10px}
  .rv-grow{flex:1;min-width:0}
  .rv-wide{width:100%;margin-top:18px}

  /* ---------- 글자 ---------- */
  .rv-logo{font-size:22px;font-weight:700;letter-spacing:-.3px;color:var(--tan)}
  .rv-muted{color:var(--muted)}
  .rv-small{font-size:12.5px;line-height:1.6}
  .rv-ok{color:var(--green)}
  .rv-note{background:var(--panel2);border-radius:10px;padding:12px;margin-top:14px;
           white-space:pre-wrap;line-height:1.6}
  .rv-foot{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}

  /* ---------- 입력 ---------- */
  .rv-label{display:block;margin-top:16px;font-size:13px;color:var(--muted)}
  .rv-input{
    display:block;width:100%;margin-top:6px;padding:12px 13px;
    background:var(--panel2);color:var(--ink);
    border:1px solid var(--line);border-radius:11px;
    font-size:16px; /* 16px 미만이면 모바일에서 확대돼 버린다 */
  }
  .rv-input:focus{outline:none;border-color:var(--tan-dim)}
  textarea.rv-input{resize:vertical}
  .rv-year{background:var(--panel2);color:var(--ink);border:1px solid var(--line);
           border-radius:9px;padding:7px 10px;font-size:14px}

  /* ---------- 버튼 ---------- */
  .rv-btn{background:var(--tan);color:#20180c;border:none;border-radius:11px;
          padding:13px 18px;font-weight:700;width:100%;margin-top:16px}
  .rv-btn:disabled{opacity:.45}
  .rv-btn-sm{background:var(--tan);color:#20180c;border:none;border-radius:9px;
             padding:8px 14px;font-weight:700;font-size:14px}
  .rv-btn-ghost{background:transparent;border:1px solid var(--line);border-radius:11px;
                padding:11px 15px;color:var(--ink)}
  .rv-btn-danger{background:var(--red);color:#1a0f0d;border:none;border-radius:11px;
                 padding:12px 18px;font-weight:700;width:100%;margin-bottom:8px}

  /* ---------- 배너 / 로딩 ---------- */
  .rv-banner{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;
             border-radius:11px;padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.6}
  .rv-banner-info{background:#1d2833;border:1px solid #2f4356}
  .rv-banner-warn{background:#2c2410;border:1px solid #5a4715;color:#f0d79a}
  .rv-banner-error{background:#2e1a18;border:1px solid #5c2f2a;color:#f0b5ae}
  .rv-banner-x{background:none;border:none;color:inherit;opacity:.6}
  .rv-spinner{display:flex;align-items:center;gap:10px;color:var(--muted);
              padding:14px 0;font-size:14px}
  .rv-spinner-dot{width:13px;height:13px;border-radius:50%;
    border:2px solid var(--tan-dim);border-top-color:transparent;animation:rv-spin .8s linear infinite}
  @keyframes rv-spin{to{transform:rotate(360deg)}}

  /* ---------- 목록 ---------- */
  .rv-month{margin-bottom:26px}
  .rv-month-head{display:flex;justify-content:space-between;font-size:13px;
                 padding:0 4px 8px;border-bottom:1px solid var(--line);margin-bottom:6px}
  .rv-item{display:flex;align-items:center;justify-content:space-between;gap:12px;
           width:100%;text-align:left;background:transparent;border:none;
           padding:13px 4px;border-bottom:1px solid rgba(255,255,255,.04)}
  .rv-item-title{font-size:15px;margin-bottom:4px}
  .rv-item-sub{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .rv-item-amt{font-variant-numeric:tabular-nums;font-size:15px;white-space:nowrap}
  .rv-clip{opacity:.6}
  .rv-empty{text-align:center;color:var(--muted);padding:60px 20px}
  .rv-pill{display:inline-flex;align-items:baseline;gap:5px;overflow:hidden;
           padding:2px 8px;border-radius:20px;font-size:11px;
           border:1px solid var(--line);max-width:100%;min-width:0}
  /* 한글은 줄바꿈 없이 통째로. 영문은 작게 옆에 붙고 자리가 모자라면 이쪽이 먼저 줄어든다 —
     화면에서 먼저 읽는 건 한글이니까. */
  .rv-pill-ko{white-space:nowrap}
  .rv-pill-en{font-size:9.5px;opacity:.62;white-space:nowrap;
              overflow:hidden;text-overflow:ellipsis;min-width:0}
  .rv-item-sub{min-width:0}
  .rv-pill-cogs{background:#22301f;border-color:#3b5535;color:#b9d6ac}
  .rv-pill-expense{background:#2a2620;border-color:#463d31;color:#d9c6a6}
  /* 합계에 잡히는 것 / 안 잡히는 것 — 목록에서 한눈에 갈리게 */
  .rv-pill-basis{background:#22301f;border-color:#3b5535;color:#b9d6ac}
  .rv-pill-nonbasis{background:#2b2523;border-color:#4a3b36;color:#c9b4ad}
  .rv-pill-personal{background:#232a30;border-color:#3a4653;color:#b7c6d6}
  /* 공제에서 뺀 개인 품목 — 목록에서 바로 구분되게 흐리고 다른 색으로 */
  .rv-pill-excluded{background:#2b2523;border-color:#4a3b36;color:#c9b4ad}

  /* ---------- 영문/한글 병기 라벨 ---------- */
  /* 영문이 본문, 한글은 옆에 작게. 세무사와 화면을 같이 봐도 말이 통하게. */
  .rv-l{display:inline-flex;align-items:baseline;gap:6px;flex-wrap:wrap}
  .rv-l b{font-weight:600}
  .rv-l i{font-style:normal;font-size:.78em;opacity:.6}
  .rv-tabs .rv-l{flex-direction:column;gap:1px;align-items:center}
  .rv-tabs .rv-l i{font-size:10px}
  .rv-country{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;
              font-size:10px;letter-spacing:.06em;
              background:var(--panel2);border:1px solid var(--line);color:var(--muted)}

  /* ---------- 환율 ---------- */
  .rv-fx{margin-top:14px;padding:14px;border-radius:12px;
         background:var(--panel2);border:1px solid var(--tan-dim)}
  .rv-fx-head{display:flex;justify-content:space-between;align-items:baseline;
              font-size:14px;padding-bottom:8px;margin-bottom:4px;
              border-bottom:1px solid var(--line)}
  .rv-fx-head strong{font-size:17px}
  .rv-cur-sel{width:104px;flex-shrink:0}
  .rv-country-sel{width:124px;flex-shrink:0}

  /* ---------- 사용량 막대 ---------- */
  .rv-quota-bar{height:6px;border-radius:99px;background:var(--panel2);
                border:1px solid var(--line);overflow:hidden;margin:8px 0}
  .rv-quota-fill{height:100%;background:var(--tan);border-radius:99px;
                 transition:width .3s}

  /* ---------- 맨 위 장부 막대 ---------- */
  /* 장부마다 강조색(--tan)이 갈리므로 이 막대의 색도 저절로 따라간다.
     글자를 읽기 전에 색으로 먼저 "지금 어느 장부인지" 알게 하는 게 목적이다. */
  .rv-root{height:100%}
  .rv-ledgerbar{display:flex;align-items:center;gap:6px;width:100%;
                padding:9px 12px 9px 16px;
                background:var(--panel2);   /* color-mix 를 모르는 브라우저용 */
                background:linear-gradient(180deg,
                  color-mix(in srgb, var(--tan) 16%, var(--panel)) 0%,
                  var(--panel) 100%);
                border-bottom:2px solid var(--tan)}
  /* 막대 안쪽: 왼쪽 넓은 부분만 장부 바꾸기 버튼, 오른쪽 ⟳ 는 따로 */
  .rv-ledgerbar-main{display:flex;align-items:center;gap:11px;flex:1;min-width:0;
                     background:none;border:none;padding:2px 0;text-align:left}
  .rv-ledgerbar-icon{width:32px;height:32px;flex-shrink:0;border-radius:9px;
                     display:flex;align-items:center;justify-content:center;
                     font-size:17px;color:#20180c;background:var(--tan)}
  .rv-ledgerbar-mid{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
  .rv-ledgerbar-name{font-size:17px;font-weight:700;color:var(--ink);letter-spacing:-.2px;
                     overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rv-ledgerbar-kind{font-size:11px;color:var(--tan);white-space:nowrap;
                     overflow:hidden;text-overflow:ellipsis}
  .rv-ledgerbar-swap{font-size:11px;color:var(--tan);border:1px solid var(--tan-dim);
                     border-radius:20px;padding:3px 9px;white-space:nowrap;flex-shrink:0}
  /* 마지막으로 파일이 올라간 시각. 버전 번호는 설정 → 앱 정보에 있다. */
  .rv-ledgerbar-ver{color:var(--muted);
                    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  .rv-inledger{display:flex;align-items:center;gap:8px;
               padding:9px 16px;font-size:12px;color:var(--muted);
               background:var(--panel2);   /* fallback */
               background:color-mix(in srgb, var(--tan) 12%, var(--panel2));
               border-bottom:1px solid var(--tan-dim)}
  .rv-inledger strong{color:var(--ink)}
  .rv-linkbtn{background:none;border:none;padding:0;color:var(--tan);
              text-decoration:underline;font-size:inherit}
  .rv-inledger-icon{width:20px;height:20px;border-radius:6px;flex-shrink:0;
                    display:flex;align-items:center;justify-content:center;
                    font-size:12px;color:#20180c;background:var(--tan)}
  .rv-sheet-icon{width:30px;height:30px;border-radius:9px;flex-shrink:0;
                 display:flex;align-items:center;justify-content:center;font-size:16px;
                 border:1px solid currentColor}

  /* ---------- 아래에서 올라오는 판 ---------- */
  .rv-sheet-back{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);
                 display:flex;align-items:flex-end}
  .rv-sheet{width:100%;max-height:82vh;overflow-y:auto;
            background:var(--panel);border-top-left-radius:18px;border-top-right-radius:18px;
            padding:10px 16px 26px;border-top:1px solid var(--line)}
  .rv-sheet-grip{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 12px}
  .rv-sheet-title{font-size:13px;color:var(--tan);margin-bottom:6px}
  .rv-sheet-group{margin-top:14px}
  .rv-sheet-item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
                 background:transparent;border:1px solid var(--line);border-radius:12px;
                 padding:13px 14px;margin-top:8px}
  .rv-sheet-on{border-color:var(--tan);background:rgba(198,160,106,.10)}
  .rv-sheet-name{display:flex;flex-direction:column;gap:2px;font-size:15px;min-width:0}
  .rv-sheet-kind{font-size:11px;color:var(--muted)}
  .rv-sheet-check{margin-left:auto;color:var(--tan)}

  /* ---------- 장부 종류 고르기 ---------- */
  .rv-kinds{display:flex;flex-direction:column;gap:10px;margin:16px 0 4px}
  .rv-scope{font-size:11px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase}
  .rv-kind{text-align:left;background:var(--panel2);border:1px solid var(--line);
           border-radius:12px;padding:13px 15px}
  .rv-kind-on{border-color:var(--tan);background:rgba(198,160,106,.10)}
  .rv-kind-t{font-size:15px;font-weight:700;color:var(--tan);margin-bottom:3px}
  .rv-kind-ko{font-size:12px;font-weight:400;color:var(--muted);margin-left:5px}
  .rv-kindtag{margin-top:10px;display:inline-block;padding:4px 11px;border-radius:20px;
              border:1px solid var(--tan-dim);color:var(--tan);font-size:13px}

  /* ---------- 맨 위 아이콘 버튼 (강제 갱신) ---------- */
  .rv-icon-btn{background:transparent;border:none;padding:4px;line-height:0;
               color:var(--tan);border-radius:10px}
  .rv-icon-btn:active{background:var(--panel2)}
  .rv-icon-btn:disabled{opacity:.6}
  .rv-spin svg{animation:rv-turn .8s linear infinite}
  @keyframes rv-turn{to{transform:rotate(360deg)}}

  /* ---------- 접었다 펴는 칸 ---------- */
  .rv-fold{display:flex;width:100%;align-items:center;justify-content:space-between;
           gap:10px;background:transparent;border:none;border-bottom:1px solid var(--line);
           margin:28px 0 4px;padding:0 0 7px;text-align:left}
  .rv-fold-t{font-size:14px;font-weight:700;color:var(--tan)}
  .rv-fold-c{color:var(--muted);font-size:12px;transition:transform .15s}
  .rv-fold-open{transform:rotate(180deg)}

  /* ---------- 연결 상태 · 앱 정보 ---------- */
  .rv-diag{margin-top:10px;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .rv-diag-row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;
               padding:10px 13px;font-size:13px;
               border-bottom:1px solid rgba(255,255,255,.05)}
  .rv-diag-row:last-child{border-bottom:none}
  .rv-diag-k{color:var(--muted);font-size:12px;white-space:nowrap}
  .rv-diag-v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
             text-align:right;overflow-wrap:anywhere}
  .rv-diag-bad .rv-diag-v{color:var(--red)}
  .rv-about{margin-top:10px;padding:16px;border-radius:12px;
            background:var(--panel2);border:1px solid var(--line);text-align:center}
  .rv-about-name{font-size:16px;font-weight:700;color:var(--tan);letter-spacing:-.2px}
  .rv-stage{margin-left:8px;padding:1px 7px;border-radius:20px;font-size:10px;
            background:var(--tan-dim);color:#20180c}

  /* ---------- 세무사 자료 점검 ---------- */
  .rv-gaps{margin-top:16px;padding:14px;border-radius:12px;
           background:#2c2410;border:1px solid #5a4715}
  .rv-gaps-head{font-size:13px;color:#f0d79a;margin-bottom:10px}
  .rv-gap{display:flex;gap:12px;align-items:flex-start;padding:8px 0;
          border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
  .rv-gap:last-of-type{border-bottom:none}
  .rv-gap-n{flex-shrink:0;min-width:26px;text-align:center;padding:1px 6px;
            border-radius:20px;background:#5a4715;color:#f0d79a;
            font-size:12px;font-variant-numeric:tabular-nums}

  /* ---------- 화면 아래 고정 알림 ---------- */
  /* 저장 버튼 옆에서 결과가 보여야 한다. 폼 맨 위에 띄우면 화면 밖이라 안 보인다. */
  .rv-fixed-note{
    position:fixed; left:12px; right:12px; bottom:14px; z-index:30;
    display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    padding:13px 15px; border-radius:12px; font-size:14px; line-height:1.6;
    box-shadow:0 8px 28px rgba(0,0,0,.45);
  }
  .rv-fixed-err{background:#3a201d; border:1px solid #7a3d36; color:#f6c9c1}
  .rv-fixed-busy{background:#262220; border:1px solid var(--line); color:var(--ink)}
  /* 오류가 아니라 알림. 붉은색으로 띄우면 뭘 잘못한 줄 안다. */
  .rv-fixed-info{background:#242a26; border:1px solid #3d5546; color:#cfe3d5}

  /* ---------- 세무사용 영문 표기 ---------- */
  .rv-en-box{
    margin-top:18px; padding:14px; border-radius:12px;
    background:var(--panel2); border:1px solid var(--line);
  }
  .rv-en-head{font-size:13px; color:var(--tan); margin-bottom:4px}

  /* ---------- 금액 하나만 빼기 ---------- */
  .rv-two-btn{margin-top:12px;gap:8px}
  .rv-two-btn .rv-btn-sm{padding:11px 15px}
  .rv-exclude{margin-top:14px;padding:14px;border-radius:12px;
              background:var(--panel2);border:1px solid var(--tan-dim)}
  .rv-exclude-head{font-size:14px;font-weight:700;color:var(--tan);margin-bottom:6px}
  .rv-exclude-calc{margin-top:12px;padding:11px 12px;border-radius:10px;
                   background:var(--panel);border:1px solid var(--line);
                   font-size:13px;line-height:1.7}

  /* ---------- 분할 ---------- */
  .rv-split-start{margin-top:12px;width:100%}
  .rv-warn-text{color:var(--amber)}
  .rv-splits{margin-top:16px;padding:14px;border-radius:12px;
             background:var(--panel2);border:1px solid var(--line)}
  .rv-splits-head{display:flex;justify-content:space-between;align-items:baseline;
                  font-size:13px;padding-bottom:10px;margin-bottom:4px;
                  border-bottom:1px solid var(--line)}
  /* 분할 줄 — 번호를 달고 카드로 감싼다. 예전엔 줄끼리 구분이 안 됐다. */
  .rv-split-row{margin-top:12px;padding:12px 13px;border-radius:12px;
                background:var(--panel);border:1px solid var(--line)}
  .rv-split-row .rv-label:first-of-type{margin-top:6px}
  .rv-split-empty{border-color:var(--amber)}
  .rv-split-head{display:flex;align-items:center;gap:9px;
                 padding-bottom:9px;border-bottom:1px solid var(--line)}
  .rv-split-n{width:22px;height:22px;flex-shrink:0;border-radius:50%;
              display:flex;align-items:center;justify-content:center;
              font-size:12px;font-weight:700;color:#20180c;background:var(--tan)}
  .rv-split-title{font-size:13px;color:var(--ink);flex:1}
  /* 세무사 자료에 찍히는 이름. 한글 밑에 작게 붙여 눈에 익게 한다. */
  .rv-split-en{display:block;font-size:11px;color:var(--muted);margin-top:1px}
  .rv-split-x{background:none;border:1px solid var(--line);border-radius:9px;
              color:var(--muted);padding:5px 10px;font-size:12px}
  .rv-split-bottom{display:flex;gap:8px;margin-top:6px}
  .rv-split-bottom .rv-input{margin-top:0;flex:1}
  .rv-split-fill{white-space:nowrap;padding:11px 12px;font-size:13px;flex-shrink:0}
  .rv-cur-tag{font-size:11px;color:var(--tan);border:1px solid var(--tan-dim);
              border-radius:20px;padding:1px 7px;margin-left:5px}
  .rv-wide-sm{width:100%;margin-top:10px;padding:9px}
  .rv-splits-view{background:transparent}
  .rv-split-line{display:flex;justify-content:space-between;gap:12px;
                 padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
  .rv-split-line:last-child{border-bottom:none}
  .rv-split-badge{font-size:11px;color:var(--tan);border:1px solid var(--tan-dim);
                  border-radius:20px;padding:1px 7px}

  /* ---------- 앱 안 카메라 ----------
     화면을 꽉 채운다. 영수증을 맞출 때 미리보기가 클수록 잘 찍힌다. */
  .rv-cam{position:fixed;inset:0;z-index:60;background:#000;
          display:flex;flex-direction:column;align-items:center;justify-content:center}
  .rv-cam-view{position:absolute;inset:0;width:100%;height:100%;
               object-fit:contain;background:#000}
  .rv-cam-bar{position:absolute;left:0;right:0;bottom:0;
              padding:18px 20px calc(18px + env(safe-area-inset-bottom));
              display:flex;align-items:center;justify-content:space-between;gap:12px;
              background:linear-gradient(to top,rgba(0,0,0,.72),rgba(0,0,0,0))}
  .rv-cam-shutter{width:68px;height:68px;border-radius:50%;flex:none;
                  background:#fff;border:4px solid rgba(255,255,255,.45);
                  box-shadow:0 0 0 2px rgba(0,0,0,.25)}
  .rv-cam-shutter:disabled{background:#8a8a8a}
  .rv-cam-side{min-width:88px;background:none;border:0;color:#fff;font-size:15px;
               padding:12px 4px;text-align:center}
  .rv-cam-ok{flex:1;background:var(--tan);color:#1b1613;border:0;border-radius:12px;
             padding:15px;font-size:16px;font-weight:600}
  .rv-cam-hint{position:absolute;left:0;right:0;
               top:calc(14px + env(safe-area-inset-top));
               margin:0;padding:0 20px;text-align:center;
               color:#fff;font-size:13px;text-shadow:0 1px 4px rgba(0,0,0,.8)}
  .rv-cam-err{position:relative;z-index:1;max-width:340px;padding:24px;text-align:center;
              color:#fff;display:flex;flex-direction:column;gap:12px}

  .rv-member-confirm{display:flex;gap:6px;align-items:center}
  .rv-member-confirm .rv-btn-danger{width:auto;margin:0;padding:6px 10px}
  .rv-boot-fail{max-width:340px;padding:20px;text-align:left;display:flex;
                flex-direction:column;gap:10px}

  /* ---------- 대문 ----------
     홈 화면에서 열면 앱이 뜨기까지 빈 화면이 잠깐 보인다. 그 자리를 이름으로 채운다.
     아래에서는 진짜 화면이 이미 그려지고 있어서, 걷힐 때 완성된 화면이 드러난다. */
  .rv-splash{position:fixed;inset:0;z-index:200;background:var(--bg);
             display:flex;flex-direction:column;align-items:center;justify-content:center;
             gap:0;opacity:1;transition:opacity .4s ease}
  .rv-splash-out{opacity:0;pointer-events:none}
  .rv-splash-in{display:flex;flex-direction:column;align-items:center;
                animation:rv-rise .55s cubic-bezier(.2,.7,.3,1) both}
  .rv-mark{display:block;border-radius:22%}
  .rv-splash-name{margin-top:18px;font-size:26px;font-weight:700;letter-spacing:-.4px;
                  color:var(--ink)}
  .rv-splash-sub{margin-top:5px;font-size:13px;color:var(--muted);letter-spacing:.02em}
  .rv-splash-foot{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom));
                  font-size:11px;color:var(--muted);opacity:.5}
  @keyframes rv-rise{from{opacity:0;transform:translateY(10px) scale(.97)}
                       to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){
    .rv-splash{transition:none}
    .rv-splash-in{animation:none}
  }

  /* 로그인 화면도 대문과 같은 얼굴로 이어지게 */
  .rv-signin-head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .rv-signin-head .rv-mark{flex:none}
  .rv-signin-sub{margin:2px 0 0}

  /* ---------- 백업 ---------- */
  /* 지금 받아야 하는지를 색으로 먼저 말한다 */
  .rv-bkstate{font-size:13px;margin:10px 0;padding:10px 12px;border-radius:10px;
              border:1px solid var(--line);background:#221f1d;color:var(--ink)}
  .rv-bkstate-ok{border-color:#3d5546;background:#1e2621;color:#bcd7c4}
  .rv-bkstate-never,.rv-bkstate-stale{border-color:var(--tan-dim);background:#2a231a;color:#e8d5b5}
  .rv-bkstate-empty{color:var(--muted)}

  .rv-howto{margin:12px 0;border:1px solid var(--line);border-radius:10px;
            background:#1e1c1b;padding:0 12px}
  .rv-howto>summary{list-style:none;cursor:pointer;padding:12px 0;font-size:13px;
                    color:var(--tan);display:flex;gap:8px;align-items:baseline}
  .rv-howto>summary::-webkit-details-marker{display:none}
  .rv-howto>summary::after{content:'▾';margin-left:auto;color:var(--muted)}
  .rv-howto[open]>summary::after{content:'▴'}
  .rv-howto-tag{font-size:11px;color:var(--muted);font-weight:400}
  /* 파일 이름처럼 그대로 읽어야 하는 글자. 줄바꿈이 되도록 둔다 — 폰에서는 길다. */
  .rv-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;
           background:#2a2724;border:1px solid var(--line);border-radius:5px;
           padding:1px 5px;color:var(--tan);word-break:break-all}
  .rv-steps{margin:0 0 12px;padding-left:20px;font-size:13px;color:var(--ink);line-height:1.75}
  .rv-steps li{margin-bottom:4px}

  /* ---------- 사진 여러 장 ----------
     한 거래에 종이가 여러 장일 수 있다. 가로로 넘겨 보게 두고,
     맨 앞 장(대표)만 테두리로 구분한다. */
  .rv-photos{display:flex;gap:10px;margin-top:12px;overflow-x:auto;
             padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .rv-photo{position:relative;flex:none;width:150px;border-radius:12px;overflow:hidden;
            border:1px solid var(--line);background:#000}
  .rv-photo-main{border-color:var(--tan);box-shadow:0 0 0 1px var(--tan)}
  .rv-photo img{display:block;width:100%;height:190px;object-fit:cover}
  .rv-photo-gone{display:flex;align-items:center;justify-content:center;text-align:center;
                 height:190px;font-size:12px;color:var(--muted);background:#1a1817}
  .rv-photo-tag{position:absolute;top:6px;left:6px;font-size:11px;
                background:rgba(0,0,0,.72);color:#fff;border-radius:20px;padding:2px 8px}
  .rv-photo-main .rv-photo-tag{background:var(--tan);color:#1b1613;font-weight:600}
  .rv-photo-acts{position:absolute;left:0;right:0;bottom:0;display:flex;
                 background:linear-gradient(to top,rgba(0,0,0,.8),rgba(0,0,0,0))}
  .rv-photo-btn{flex:1;background:none;border:0;color:#fff;font-size:12px;padding:9px 2px}

  .rv-lightbox{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.94);
               display:flex;align-items:center;justify-content:center;padding:12px}
  .rv-lightbox img{max-width:100%;max-height:100%;object-fit:contain}
  .rv-lightbox-x{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;
                 background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:10px;
                 padding:10px 14px;font-size:14px}

  /* ---------- 사진 ---------- */
  .rv-photo-row{display:flex;gap:10px;margin-top:6px}
  .rv-preview{margin-top:14px;border-radius:12px;overflow:hidden;border:1px solid var(--line);
              background:#000;max-height:340px;display:flex;justify-content:center}
  .rv-preview img{max-width:100%;max-height:340px;object-fit:contain}

  /* ---------- 상세 / 리포트 ---------- */
  .rv-detail-amt{font-size:34px;font-weight:700;letter-spacing:-1px;margin-bottom:6px}
  .rv-deduct{margin-top:18px;padding:13px;border-radius:11px;background:var(--panel2);
             display:flex;justify-content:space-between;align-items:baseline;gap:8px;
             flex-wrap:wrap;font-size:14px}
  .rv-deduct-k{font-weight:600}
  .rv-deduct-ko{color:var(--muted);font-size:12px}
  .rv-confirm{margin-top:22px;padding:16px;border-radius:12px;
              background:#2e1a18;border:1px solid #5c2f2a}
  /* 칸마다 색을 준다. 목록 화면의 분류 알약과 같은 색이라 두 화면이 이어 보인다.
     --sec 하나만 바꾸면 제목·줄·막대가 전부 따라간다. */
  .rv-report-sec{margin-bottom:30px;--sec:var(--tan)}
  .rv-report-sec[data-group="cogs"],
  .rv-report-sec[data-group="basis"]{--sec:#8fbf72}      /* 팔 물건 · 집값에 더해지는 것 */
  .rv-report-sec[data-group="expense"]{--sec:#c8a26a}    /* 그 해 경비 */
  .rv-report-sec[data-group="excluded"],
  .rv-report-sec[data-group="nonbasis"]{--sec:#a08e86}   /* 합계에 안 들어가는 것 */
  .rv-report-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
                  font-size:15px;padding-bottom:8px;
                  border-bottom:2px solid var(--sec)}
  .rv-report-title{display:flex;align-items:center;gap:8px;min-width:0}
  .rv-report-title::before{content:'';width:9px;height:9px;border-radius:3px;
                           background:var(--sec);flex-shrink:0}
  .rv-report-head strong{color:var(--sec);white-space:nowrap}
  /* 비중 막대 — 숫자를 읽기 전에 어디가 큰지 먼저 보이게 */
  .rv-share{height:3px;border-radius:99px;background:rgba(255,255,255,.06);margin-top:7px}
  .rv-share span{display:block;height:100%;border-radius:99px;background:var(--sec);opacity:.75}
  /* 분류를 눌러 그 안의 영수증을 펼치기 */
  .rv-cat-row{cursor:pointer}
  .rv-caret{margin-left:7px;color:var(--sec);font-size:11px}
  .rv-cat-open{padding:4px 0 12px !important;border-bottom:1px solid rgba(255,255,255,.04)}
  .rv-mini{display:flex;align-items:center;justify-content:space-between;gap:12px;
           width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
           border-radius:10px;padding:10px 12px;margin-top:6px}
  .rv-mini-main{min-width:0;flex:1}
  .rv-mini-title{font-size:14px;margin-bottom:2px}

  /* 정렬 탭 */
  .rv-seg{display:flex;gap:6px;margin-bottom:20px;padding:4px;border-radius:11px;
          background:var(--panel2);border:1px solid var(--line)}
  .rv-seg button{flex:1;background:none;border:none;border-radius:8px;
                 padding:8px 6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
  .rv-seg button.on{background:var(--tan);color:#20180c;font-weight:700}
  .rv-table{width:100%;border-collapse:collapse;margin-top:6px}
  .rv-table td{padding:11px 4px;border-bottom:1px solid rgba(255,255,255,.04);
               vertical-align:top;font-size:14px}
  .rv-line{width:38px;color:var(--sec);font-variant-numeric:tabular-nums;font-size:12px;padding-top:13px}
  .rv-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

  /* ---------- 설정: 식구 ---------- */
  .rv-h3{font-size:14px;margin:28px 0 4px;padding-bottom:7px;
         border-bottom:1px solid var(--line);color:var(--tan)}
  .rv-members{margin-top:10px}
  .rv-member{display:flex;justify-content:space-between;align-items:center;gap:12px;
             padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:14px}
  .rv-member-pending{opacity:.65}
  .rv-role{font-size:11px;color:var(--tan);border:1px solid var(--tan-dim);
           border-radius:20px;padding:2px 9px;white-space:nowrap}
  .rv-tiny{padding:6px 10px;font-size:12px}

  /* ---------- 세무사 자료 ---------- */
  .rv-taxdoc-actions{margin-bottom:22px}
  .tx-paper{
    background:#fff;color:#111;border-radius:10px;padding:26px 24px;
    font-size:13px;line-height:1.55;
    /* 종이 위의 문서라서 화면 테마와 무관하게 항상 흰 바탕 검은 글씨다 */
  }
  .tx-head{border-bottom:2px solid #111;padding-bottom:14px;margin-bottom:20px}
  .tx-head h1{font-size:19px;margin:0 0 3px;letter-spacing:-.2px}
  .tx-sub{margin:0 0 12px;color:#555;font-size:12.5px}
  .tx-meta{border-collapse:collapse;font-size:12px}
  .tx-meta td{padding:2px 0;vertical-align:top}
  .tx-meta td:first-child{color:#666;padding-right:16px;white-space:nowrap}
  .tx-sec{margin-bottom:22px}
  .tx-sec h2{font-size:13.5px;margin:0 0 8px;text-transform:uppercase;
             letter-spacing:.06em;color:#333}
  .tx-table{width:100%;border-collapse:collapse}
  .tx-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
               color:#666;border-bottom:1px solid #999;padding:5px 6px;font-weight:600}
  .tx-table td{padding:5px 6px;border-bottom:1px solid #e2e2e2}
  .tx-num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .tx-line{color:#666;width:44px;font-variant-numeric:tabular-nums}
  .tx-total td{border-top:1.5px solid #111;border-bottom:none;font-weight:700;padding-top:8px}
  .tx-grand .tx-total td{font-size:14px}
  .tx-notes{border-top:1px solid #ccc;padding-top:14px;font-size:11.5px;color:#444}
  .tx-notes h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;
               color:#666;margin:0 0 6px}
  .tx-notes ul{margin:0;padding-left:17px}
  .tx-notes li{margin-bottom:3px}
  .tx-foot{margin-top:18px;padding-top:10px;border-top:1px solid #ccc;
           font-size:10.5px;color:#777;text-align:right}
  .tx-disc{margin:0 0 8px;text-align:left;line-height:1.55;font-size:10.5px}

  /* 인쇄하면 문서만 남는다. 태블릿 인쇄 화면에서 "PDF로 저장"을 고르면 그대로 파일이 된다. */
  @media print{
    html,body{background:#fff !important;color:#111 !important}
    .rv-noprint,.rv-tabs,.rv-topbar{display:none !important}
    .rv-screen,.rv-body{display:block !important;height:auto !important;
                        overflow:visible !important;padding:0 !important}
    .tx-paper{border-radius:0;padding:0;font-size:11pt}
    .tx-sec{page-break-inside:avoid}
    .tx-notes{page-break-inside:avoid}
    @page{margin:16mm}
  }

  /* ---------- 하단 탭 ---------- */
  .rv-tabs{display:flex;border-top:1px solid var(--line);background:var(--panel);
           padding-bottom:env(safe-area-inset-bottom)}
  .rv-tabs button{flex:1;background:none;border:none;padding:15px 0;
                  color:var(--muted);font-size:13px}
  .rv-tabs button.on{color:var(--tan);font-weight:700;box-shadow:inset 0 2px 0 var(--tan)}
</style>
</head>
<body>
<div id="root"></div>

<!-- 라이브러리: 빌드 단계 없이 브라우저가 직접 받는다 -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<!-- 우리 코드: 전역에 의존하므로 순서가 곧 의존성이다.
     파일을 전부 한 층에 둔 이유는 태블릿에서 GitHub에 올리기 위해서다 —
     안드로이드 파일 선택기가 폴더를 통째로 고르지 못한다. -->
<script src="config.js"></script>
<script src="labels.js"></script>
<script src="categories.js"></script>
<script src="core.js"></script>
<script type="text/babel" src="app.jsx"></script>

<script>
  // 홈 화면에 추가했을 때 앱처럼 뜨게 하는 최소한의 서비스워커.
  // network-first 라서 "고쳤는데 안 바뀌네" 사태가 생기지 않는다.
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
</script>
</body>
</html>
